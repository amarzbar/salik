<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Murid Day Journal</title>
    <meta name="description" content="Personal Islamic calendar and worship tracker" />
    <!-- Opaque status bar ("default", not black-translucent): on iOS 26 a
         translucent bar blurs whatever sits under it and, through WebKit bug
         301108, leaves the viewport short by the status-bar height, which
         shows up as a dead band under the tab bar. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F9F6F2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141210" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Murid" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-512.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
