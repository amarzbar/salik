services:
  murid-day-journal:
    # Published by .github/workflows/docker.yml on every push to main.
    # `build: .` stays as a fallback: `docker compose up -d --build` still
    # builds locally from the checkout.
    image: ghcr.io/amarzbar/salik:latest
    build: .
    container_name: murid-day-journal
    restart: always
    ports:
      - "3011:3011"
    environment:
      PORT: 3011
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - ./data:/app/data
    networks:
      - murid-network

networks:
  murid-network:
    driver: bridge
