services:
  murid-day-journal:
    build: .
    container_name: murid-day-journal
    restart: always
    ports:
      - "3011:3011"
    environment:
      PORT: 3011
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - ./data:/app/data
    networks:
      - murid-network

networks:
  murid-network:
    driver: bridge
